<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Lorekeeper social card</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<!-- Source for og/card.png (1200x630). Render: element screenshot of #card. -->
<style>
:root { --night:#0b0b2b; --indigo:#3b1f6e; --purple:#7a3cff; --purple-text:#b99bff; --blue:#2f6bff; --sky:#49c6ff; --crimson:#e0284f; --crimson-dark:#8a1636; --ink:#f2efe6; --ink-dim:#c8c4d8; --shadow:#05051a; }
html, body { margin:0; padding:0; background:#000; }
#card {
  position:relative; width:1200px; height:630px; overflow:hidden; color:var(--ink);
  background-color:var(--night);
  background-image:
    radial-gradient(ellipse at 28% 45%, rgba(122,60,255,.55), transparent 55%),
    radial-gradient(ellipse at 50% -20%, rgba(47,107,255,.35), transparent 60%),
    linear-gradient(180deg, var(--night) 0%, #10103a 55%, #1a1050 100%);
}
.stars { position:absolute; inset:0; }
.stars::before, .stars::after { content:""; position:absolute; width:5px; height:5px; background:transparent; }
.stars::before {
  box-shadow:
    40px 40px #f2efe6, 170px 120px #49c6ff, 300px 30px #f2efe6, 520px 70px #b99bff, 640px 22px #f2efe6,
    760px 150px #49c6ff, 1120px 40px #f2efe6, 1150px 210px #b99bff, 1060px 590px #f2efe6, 900px 600px #49c6ff,
    60px 560px #b99bff, 230px 600px #f2efe6, 30px 300px #49c6ff, 1170px 420px #f2efe6, 470px 590px #b99bff,
    990px 18px #49c6ff, 380px 140px #f2efe6, 120px 470px #f2efe6;
  opacity:.75;
}
.stars::after {
  width:3px; height:3px;
  box-shadow:
    90px 90px #f2efe6, 260px 70px #b99bff, 430px 40px #49c6ff, 700px 100px #f2efe6, 860px 30px #b99bff,
    1010px 120px #f2efe6, 1090px 330px #49c6ff, 1140px 520px #b99bff, 760px 580px #f2efe6, 340px 560px #49c6ff,
    20px 420px #f2efe6, 150px 330px #b99bff, 600px 610px #f2efe6, 1185px 90px #f2efe6;
  opacity:.5;
}
.crt { position:absolute; inset:0; z-index:5; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 5px); }
.frame { position:absolute; inset:18px; border:4px solid var(--indigo); z-index:1; }
.frame::after { content:""; position:absolute; inset:6px; border:2px dashed rgba(185,155,255,.25); }
.content {
  position:absolute; z-index:2; left:80px; right:80px; top:58px; bottom:58px;
  display:grid; grid-template-columns:350px 1fr; gap:46px; align-items:center;
}
.mascot { width:350px; height:auto; image-rendering:pixelated; filter:drop-shadow(10px 10px 0 var(--shadow)); }
.left { display:flex; flex-direction:column; align-items:center; gap:28px; }
.press { font-family:"Press Start 2P"; font-size:15px; letter-spacing:1px; margin:0; }
.press .k { color:#ffd23f; }
h1 {
  font-family:"Press Start 2P"; font-weight:400; font-size:57px; line-height:1; margin:0 0 30px;
  text-shadow:5px 5px 0 var(--crimson-dark), 10px 10px 0 var(--shadow); letter-spacing:1px;
}
.tag { font-family:"Press Start 2P"; font-size:21px; line-height:1.75; margin:0 0 30px; text-shadow:3px 3px 0 var(--shadow); }
.tag span { display:block; }
.tag .c1 { color:var(--ink); } .tag .c2 { color:var(--sky); } .tag .c3 { color:#ff8aa4; }
.dialog {
  position:relative; background:#08082a; margin:4px; padding:14px 22px 12px;
  box-shadow: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink),
    8px 12px 0 0 var(--shadow), 12px 8px 0 0 var(--shadow);
  font-family:"VT323", monospace; line-height:1.1;
}
.dialog .game { display:inline-block; font-size:22px; color:var(--night); background:var(--sky); padding:0 8px; letter-spacing:.05em; margin-bottom:8px; }
.dialog p { margin:0; font-size:31px; }
.dialog .you { color:var(--ink); }
.dialog .you b { color:#ff8aa4; font-weight:400; }
.dialog .lk { color:var(--ink-dim); margin-top:6px; }
.dialog .lk b { color:var(--sky); font-weight:400; }
.dialog .lk q { color:#ffd23f; }
.dialog .cur { position:absolute; right:14px; bottom:6px; color:#ffd23f; font-size:24px; }
</style>
</head>
<body>
<div id="card">
  <div class="stars"></div>
  <div class="frame"></div>
  <div class="content">
    <div class="left">
      <img class="mascot" src="../img/book.svg" alt="" width="350" height="263">
      <p class="press">PRESS <span class="k">CTRL+ALT+SPACE</span></p>
    </div>
    <div>
      <h1>LOREKEEPER</h1>
      <p class="tag"><span class="c1">Hold a key.</span><span class="c2">Ask out loud.</span><span class="c3">Hear the answer.</span></p>
      <div class="dialog">
        <span class="game">ENTER THE GUNGEON</span>
        <p class="you"><b>YOU &#9656;</b> "What does the Gilded Hydra do?"</p>
        <p class="lk"><b>LK &#9656;</b> &hellip;Its flavor text: <q>Heads Up!</q></p>
        <span class="cur">&#9660;</span>
      </div>
    </div>
  </div>
  <div class="crt"></div>
</div>
</body>
</html>
